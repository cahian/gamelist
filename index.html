<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog & Wishlist</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#8a8f98; --row:#161a21; --row2:#1b2028; --acc:#4ade80; --warn:#facc15; --bad:#f87171; --link:#7dd3fc; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; padding:16px }
  h1 { font-size:20px; margin:0 0 4px } .sub { color:var(--muted); margin:0 0 16px; font-size:12px }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px }
  .tab { padding:6px 12px; border:1px solid #2a2f38; border-radius:6px; background:var(--row); cursor:pointer; color:var(--fg) }
  .tab.on { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600 }
  input, select { background:var(--row); color:var(--fg); border:1px solid #2a2f38; border-radius:6px; padding:6px 8px }
  table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:6px 8px; white-space:nowrap }
  th { color:var(--muted); font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--bg); border-bottom:1px solid #2a2f38 }
  th.on { color:var(--fg) } th.on::after { content:" ▼" } th.on.asc::after { content:" ▲" }
  tbody tr:nth-child(odd) { background:var(--row) } tbody tr:nth-child(even) { background:var(--row2) }
  td.name { white-space:normal } td.name a { color:var(--link); text-decoration:none } td.name a:hover { text-decoration:underline }
  .s { display:inline-block; min-width:34px; text-align:center; padding:2px 6px; border-radius:4px; font-weight:700; color:#000 }
  .g { background:var(--acc) } .y { background:var(--warn) } .r { background:var(--bad) } .n { background:#2a2f38; color:var(--muted); font-weight:400 }
  .plat { color:var(--muted); font-size:12px }
  .cnt { color:var(--muted); font-size:12px; margin-left:auto }
  .low { color:var(--muted) } .low::after { content:" ?"; color:var(--warn) }
  .plat .long { display:inline } .plat .short { display:none }
  @media (max-width: 520px) {
    body { padding:10px } h1 { font-size:18px } .sub { display:none }
    th, td { padding:6px 4px } .s { min-width:30px; padding:2px 4px }
    .year { display:none }
    .plat .long { display:none } .plat .short { display:inline }
    th[data-k="critic"] .l, th[data-k="user"] .l { display:none }
    td.name .plat { display:none }
    input#q { width:100%; }
  }
</style>
</head>
<body>
<h1>Backlog &amp; Wishlist</h1>
<p class="sub">Playlist IGN cruzada com Metacritic. Clique nos cabeçalhos para ordenar. Nomes com <span style="color:var(--warn)">?</span> = match incerto no Metacritic. Gerado em <span id="gen"></span>.</p>
<div class="bar">
  <button class="tab on" data-list="B">Backlog</button>
  <button class="tab" data-list="W">Wishlist</button>
  <button class="tab" data-list="*">Tudo</button>
  <select id="plat"><option value="">Todas plataformas</option></select>
  <input id="q" placeholder="filtrar…" size="18">
  <span class="cnt" id="cnt"></span>
</div>
<table>
  <thead><tr>
    <th data-k="name">Jogo</th>
    <th data-k="critic" class="on">MC<span class="l">etacritic</span></th>
    <th data-k="user">Us<span class="l">uários</span></th>
    <th data-k="year" class="year">Ano</th>
    <th data-k="plat">Plataforma</th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
<script src="data.js"></script>
<script>
  const S = { list:'B', k:'critic', asc:false, plat:'', q:'' };
  const cls = (v,max) => v==null ? 'n' : (v/max >= 0.75 ? 'g' : v/max >= 0.5 ? 'y' : 'r');
  const badge = (v,max) => `<span class="s ${cls(v,max)}">${v==null ? '–' : v}</span>`;
  const SHORT = {'Xbox Series X/S':'XSX','Nintendo Switch':'NSW','Nintendo Switch 2':'NSW2','Nintendo 3DS':'3DS','PlayStation 5':'PS5','PlayStation 4':'PS4','PlayStation 3':'PS3','PlayStation 2':'PS2','GameCube':'GC'};
  const plat = p => `<span class="long">${p}</span><span class="short">${SHORT[p]||p}</span>`;
  document.getElementById('gen').textContent = GENERATED;
  const plats = [...new Set(GAMES.map(g=>g.plat))].sort();
  for (const p of plats) { const o=document.createElement('option'); o.value=o.textContent=p; document.getElementById('plat').appendChild(o); }
  function render(){
    let rows = GAMES.filter(g => (S.list==='*'||g.list===S.list) && (!S.plat||g.plat===S.plat) && (!S.q||g.name.toLowerCase().includes(S.q)));
    rows.sort((a,b)=>{ let x=a[S.k], y=b[S.k]; if (typeof x==='string') return S.asc ? x.localeCompare(y) : y.localeCompare(x); x = x==null ? -1 : x; y = y==null ? -1 : y; return S.asc ? x-y : y-x; });
    document.getElementById('tb').innerHTML = rows.map(g=>`<tr>
      <td class="name${g.conf<60?' low':''}"><a href="https://www.metacritic.com/game/${g.mslug}/" target="_blank" rel="noopener">${g.name}</a>${g.found&&g.found!==g.name?` <span class="plat">(${g.found})</span>`:''}</td>
      <td>${badge(g.critic,100)}</td><td>${badge(g.user,10)}</td><td class="year">${g.year||''}</td><td class="plat">${plat(g.plat)}</td></tr>`).join('');
    document.getElementById('cnt').textContent = rows.length + ' jogos';
    document.querySelectorAll('th').forEach(th=>{ th.classList.toggle('on', th.dataset.k===S.k); th.classList.toggle('asc', th.dataset.k===S.k && S.asc); });
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.list===S.list));
  }
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ S.list=t.dataset.list; render(); });
  document.querySelectorAll('th').forEach(th=>th.onclick=()=>{ if (S.k===th.dataset.k) S.asc=!S.asc; else { S.k=th.dataset.k; S.asc = th.dataset.k==='name'; } render(); });
  document.getElementById('plat').onchange = e=>{ S.plat=e.target.value; render(); };
  document.getElementById('q').oninput = e=>{ S.q=e.target.value.toLowerCase(); render(); };
  render();
</script>
</body>
</html>
